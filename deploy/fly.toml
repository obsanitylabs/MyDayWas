# OBS-313 D3: reference platform config for the chosen deployment model —
# container/VM with a persistent local volume (docs/PRODUCTION-DEPLOY-MODEL.md).
#
# PLACEHOLDERS ONLY — this file commits NO secrets and NO real app identity.
# Provisioning/deployment stays GATED on the OBS-237 external written sign-off
# (docs/PRODUCTION-DEPLOYMENT.md §6). Costs sit inside the CFO envelope
# (OBS-167: $2,000/mo planned, $2,500/mo cap) — provisioning requires the
# CFO/CEO approval routed through Approvals before any spend is committed.
#
# Usage (at provisioning, after gates clear):
#   fly launch --config deploy/fly.toml --no-deploy   # or equivalent import
#   fly secrets set RELAYER_ALERT_WEBHOOK=… RELAYER_EOA_SECRET_KEY=…  (secret store)
#   fly deploy --config deploy/fly.toml --build-arg none
# Env values not marked secret are injected via platform env; secrets via the
# platform secret store — NEVER via fly.toml (this file is public).

app = "mydaywas-relayer"          # placeholder — set at provisioning
primary_region = "iad"            # placeholder — set at provisioning

[env]
  RELAYER_PORT = "8081"
  RELAYER_REQUIRE_TLS = "1"
  RELAYER_RATE_PER_MIN = "60"
  RELAYER_DB_PATH = "/data/mydaywas-relayer.db"
  RELAYER_SUBMITTER = "dry-run"   # real cutover is CISO-gated (OBS-166/OBS-237)

# F3/OBS-234: SQLite WAL on a persistent LOCAL volume, single-writer topology.
[[mounts]]
  source = "mydaywas_relayer_data"  # placeholder volume name
  destination = "/data"

[http_service]
  internal_port = 8081
  # TLS terminates here; the process enforces x-forwarded-proto itself too.
  force_https = true
  auto_stop_machines = false       # long-lived instance keeps day-over-day
  auto_start_machines = true       # custody/Sybil baselines warm (OBS-234)
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100