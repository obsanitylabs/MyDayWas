# OBS-313 D3 / OBS-676: single reference platform config for the chosen
# deployment model — container/VM with a persistent local volume
# (docs/PRODUCTION-DEPLOY-MODEL.md). It sits NEXT TO the Dockerfile it builds
# (relayer/Dockerfile) so the config, the image, and the build context cannot
# drift apart.
#
# Placeholders only — this file commits NO secrets. The single real, public
# value is the browser CORS origin of record (RELAYER_ALLOWED_ORIGINS): a
# public origin, not app identity or a secret.
# Provisioning/deployment stays GATED on the OBS-237 external written sign-off
# (docs/PRODUCTION-DEPLOYMENT.md §6). Costs sit inside the CFO envelope
# (board-APPROVED lean envelope, OBS-357 `lean-envelope` rev 1: $9.44/mo
# planned, $25.00/mo cap — approvals 063d6679 + a04b7903) — provisioning
# requires the CFO/CEO approval routed through Approvals before any spend
# is committed. The envelope is a ceiling, not a purchase.
#
# Usage (run BOTH commands from the repo root; at provisioning, after gates
# clear). `relayer` is the working directory: flyctl looks up fly.toml and the
# Dockerfile inside it, so the build CONTEXT is `relayer/` (where the relayer's
# own package.json / tsconfig / src / test live — NOT the repo-root landing
# tree). Fly's app-config reference documents this as the working-directory
# argument (`[build] dockerfile` alone does not change the context).
#   fly launch --config relayer/fly.toml --no-deploy   # or equivalent import
#   fly secrets set RELAYER_ALERT_WEBHOOK=… RELAYER_EOA_SECRET_KEY=… RELAYER_PUBLISH_SECRET=…  (secret store)
#   fly deploy relayer
# Env values not marked secret are injected via platform env; secrets via the
# platform secret store — NEVER via fly.toml (this file is public).

app = "mydaywas-relayer"          # placeholder — set at provisioning
primary_region = "iad"            # placeholder — set at provisioning

# OBS-676: the relayer image build. `dockerfile` is resolved RELATIVE TO THIS
# CONFIG's directory (relayer/), so it is relayer/Dockerfile. The build context
# is set by `fly deploy relayer` (the working-directory argument) — that is what
# makes the relayer's own manifest the one the Dockerfile copies. CI builds the
# identical image with `context: relayer` (.github/workflows/ci.yml).
[build]
  dockerfile = "Dockerfile"

[env]
  RELAYER_PORT = "8081"
  RELAYER_REQUIRE_TLS = "1"
  RELAYER_RATE_PER_MIN = "60"
  # M1/OBS-760: trusted edge client-IP header for rate shaping (Fly sets this).
  RELAYER_CLIENT_IP_HEADER = "fly-client-ip"
  # H1/OBS-760: operator auth on /v1/publish. The SECRET itself is injected via
  # the platform secret store (RELAYER_PUBLISH_SECRET), never this public file.
  # The durable production profile refuses to start without it.
  RELAYER_DB_PATH = "/data/mydaywas-relayer.db"
  RELAYER_SUBMITTER = "dry-run"   # real cutover is CISO-gated (OBS-166/OBS-237)
  # OBS-628/OBS-549: the browser CORS allow-list that actually turns the
  # diary's POST path on. Non-secret. Unset or empty = CLOSED (no browser
  # origin may POST); exact origins only, never "*" or a reflected Origin.
  # Value = the app origin of record (docs/PRODUCTION-DOMAIN-DECISION.md).
  RELAYER_ALLOWED_ORIGINS = "https://mydaywas.com"

# F3/OBS-234: SQLite WAL on a persistent LOCAL volume, single-writer topology.
[[mounts]]
  source = "mydaywas_relayer_data"  # placeholder volume name
  destination = "/data"

[http_service]
  internal_port = 8081
  # TLS terminates here; the process enforces x-forwarded-proto itself too.
  force_https = true
  auto_stop_machines = false       # long-lived instance keeps day-over-day
  auto_start_machines = true       # custody/Sybil baselines warm (OBS-234)
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100
